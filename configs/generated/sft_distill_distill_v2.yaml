# Generated by distillation.make_configs from data/distill/baseline_budget.json.
# run_id=distill_v2  max_steps=3180  early_stop_patience=null (controlled comparison).
data:
  tokenizer_path: processed_data/tokenizer/tokenizer.pkl
  out_dir: processed_data/sft_distill_distill_v2
  val_fraction: 0.02
  seed: 42
  replay_prob: 0.05
  pretrain_dir: processed_data/pretrain
  source:
    type: alpaca
    paths: data/distill/sft/distill_v2/train.parquet
    split: train
train:
  out_dir: checkpoints/sft_distill_distill_v2
  batch_size: 32
  grad_accum_steps: 1
  lr: 0.0003
  min_lr: 3.0e-05
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 100
  max_steps: 3180
  epochs: null
  eval_interval: 100
  eval_batches: 50
  early_stop_patience: null
  min_delta: 0.0
  save_interval: 500
  log_interval: 20
  amp: true
  num_workers: 4
  seed: 42
  draw: true
