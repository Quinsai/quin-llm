# CPU-only mini smoke configuration. Not meant to produce a good model.
model:
  # vocab_size comes from data.tokenizer_path at runtime.
  block_size: 128
  n_layer: 2
  n_embd: 128
  n_head: 4
  dropout: 0.0
  tie_weights: true
  use_sdpa: true

data:
  tokenizer_path: processed_data/tokenizer_mini/tokenizer.pkl
  out_dir: processed_data/pretrain_mini
  max_tokens: 2000000
  val_fraction: 0.05
  seed: 42
  sources:
    - type: file
      path: pipeline/fixtures/tiny_corpus.txt
      weight: 1.0

train:
  out_dir: checkpoints/pretrain_mini
  batch_size: 16
  grad_accum_steps: 1
  lr: 0.001
  min_lr: 0.0001
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 20
  max_steps: 100
  epochs: null
  eval_interval: 20
  eval_batches: 5
  save_interval: 50
  log_interval: 5
  amp: false
  num_workers: 0
  seed: 42
  draw: true
