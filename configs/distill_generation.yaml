# Teacher data generation. This YAML is the single source of truth for the
# run id, category counts, and output directories.  The scripts do not have a
# separate pilot/main or 2k/40k switch: edit this file instead.
#
#   ./scripts/distill/01_generate.sh              # full run (counts below)
#   ./scripts/distill/01_generate.sh --limit 20   # small test, same tasks
#   ./scripts/distill/01_generate.sh --dry-run --limit 5
run_id: distill_v1
teacher_config: configs/distill_teacher.yaml
out_dir: data/distill/raw
tasks_dir: data/distill/tasks
prompt_version: v1
seed: 42
max_requests: null
max_completion_tokens: null

categories:
  fact_qa:
    count: 20000
    seeds: distillation/seeds/train_entities.jsonl
    difficulty: [easy, medium]
  format_json:
    count: 6000
    seeds: distillation/seeds/topics.jsonl
    difficulty: [easy, medium]
  extraction:
    count: 4000
    seeds: distillation/seeds/topics.jsonl
    difficulty: [easy]
  instruction:
    count: 6000
    seeds: distillation/seeds/topics.jsonl
    difficulty: [easy, medium]
  reasoning:
    count: 4000
    difficulty: [easy]
